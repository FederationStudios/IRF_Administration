name: NPM Audit Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
    - uses: actions/checkout@v5
    - name: Install pnpm and Node.js
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # 3.2.0
      with:
        runtime: node@${{ matrix.node-version }}
        cache: true
    # Run an audit check, and fail if any dependencies aren't met.
    - run: pnpm audit --audit-level=moderate
